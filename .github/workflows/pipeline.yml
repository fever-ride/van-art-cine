name: Data Pipeline (scrapers + enrich)

# Every other calendar day at 12:00 UTC (~04:00–05:00 America/Vancouver),
# then a random 0–60 min sleep so the scrape start time isn't a fixed clock tick.
# Day-of-month */2 can occasionally fire ~1 day apart at month boundaries —
# acceptable for this non-critical batch job.
on:
  schedule:
    - cron: "0 12 */2 * *"
  workflow_dispatch: # allow manual "Run workflow" from the Actions UI

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Jitter scrape start (0–60 min)
        if: github.event_name == 'schedule'
        run: |
          SECONDS=$((RANDOM % 3600))
          echo "Sleeping ${SECONDS}s before scrapers…"
          sleep "$SECONDS"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scrapers/requirements.txt
            database/requirements.txt

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/requirements.txt
          playwright install --with-deps chromium

      - name: Install database pipeline dependencies
        run: pip install -r database/requirements.txt

      # db_helper.py requires database/.env to exist on disk (load_dotenv +
      # ENV_PATH.exists()), so we materialize secrets into that file rather
      # than relying on job-level env alone.
      - name: Write database/.env from secrets
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          umask 077
          {
            echo "DATABASE_URL=${PROD_DATABASE_URL}"
            echo "TMDB_API_KEY=${TMDB_API_KEY}"
            echo "OMDB_API_KEY=${OMDB_API_KEY}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
          } > database/.env

      - name: Run scrapers
        # --continue-on-error: one venue site breaking shouldn't skip the rest.
        # continue-on-error on the step lets enrichment still run on whatever
        # JSON was produced; we re-fail the job below if any scraper failed.
        continue-on-error: true
        id: scrapers
        run: python scrapers/run_all_scrapers.py --continue-on-error

      - name: Run enrichment pipeline
        id: enrich
        working-directory: database/scripts
        run: python run_all.py --stop-on-error

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: database/logs/
          if-no-files-found: ignore
          retention-days: 14

      # Keep the job red (GitHub failure email) when a scraper failed, even if
      # enrichment succeeded on partial data.
      - name: Fail job if scrapers failed
        if: always() && steps.scrapers.outcome == 'failure'
        run: |
          echo "One or more scrapers failed (enrichment may still have run)."
          exit 1
